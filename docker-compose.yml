services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cippi
      POSTGRES_PASSWORD: cippi # solo sviluppo locale
      POSTGRES_DB: cippi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Eseguito solo al primo avvio, quando il volume è vuoto.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
